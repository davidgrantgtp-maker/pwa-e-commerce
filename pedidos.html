<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Mis pedidos - MiApp Store" />
  <title>Mis pedidos · MiApp Store</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { accent: '#22d3ee' } } } };</script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body data-page="pedidos" class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col relative shadow-2xl">
    <header class="sticky top-0 z-20 bg-gray-950/90 backdrop-blur border-b border-gray-800 safe-top">
      <div class="flex items-center gap-3 px-4 pt-3 pb-3">
        <a href="./index.html" class="w-10 h-10 grid place-items-center rounded-xl bg-gray-900 border border-gray-800 shrink-0" aria-label="Volver">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="flex-1">
          <p class="font-bold leading-none">Mis pedidos</p>
          <p id="orders-subtitle" class="text-xs text-gray-400 mt-0.5">Guardados en este dispositivo</p>
        </div>
      </div>
    </header>

    <main class="flex-1 px-4 pb-28 pt-4">
      <div id="orders-empty" class="hidden text-center py-16">
        <div class="w-20 h-20 mx-auto rounded-full bg-gray-900 border border-gray-800 grid place-items-center text-gray-500">
          <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
        </div>
        <p class="text-lg font-bold mt-4">Todavía no hiciste pedidos</p>
        <p class="text-sm text-gray-400 mt-1">Cuando confirmes uno, va a aparecer acá.</p>
        <a href="./index.html" class="inline-block mt-5 bg-cyan-400 text-gray-950 font-bold px-5 py-3 rounded-full">Ver productos</a>
      </div>

      <div id="orders-list" class="space-y-3"></div>

      <p class="text-[11px] text-gray-600 text-center mt-6">Los pedidos se guardan solo en este dispositivo (localStorage).</p>
    </main>

    <nav class="tabbar fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-gray-950/95 backdrop-blur border-t border-gray-800 z-20">
      <div class="grid grid-cols-4 px-4 pt-2">
        <a href="./index.html" data-tab="home" class="tab-link flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
          Inicio<span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
        <a href="./carrito.html" data-tab="carrito" class="tab-link relative flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          Carrito<span data-cart-count class="hidden absolute top-0 right-1/2 translate-x-5 min-w-[16px] h-4 px-1 rounded-full bg-cyan-400 text-gray-950 text-[9px] font-bold grid place-items-center">0</span><span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
        <a href="./pedidos.html" data-tab="pedidos" class="tab-link relative flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          Pedidos<span data-orders-count class="hidden absolute top-0 right-1/2 translate-x-5 min-w-[16px] h-4 px-1 rounded-full bg-amber-400 text-gray-950 text-[9px] font-bold grid place-items-center">0</span><span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
        <a href="./perfil.html" data-tab="perfil" class="tab-link flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>
          Perfil<span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
      </div>
    </nav>

    <div id="toast" class="fixed bottom-24 left-1/2 z-30 bg-cyan-400 text-gray-950 text-sm font-semibold px-4 py-2.5 rounded-full shadow-xl max-w-[90%] text-center"></div>
  </div>

  <script src="./js/supabase-config.js"></script>
  <script src="./js/storefront.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/shop.js"></script>
  <script src="./js/app.js"></script>
  <script>
    (function () {
      const list = document.getElementById('orders-list');
      const empty = document.getElementById('orders-empty');
      const subtitle = document.getElementById('orders-subtitle');
      const orders = Shop.getOrders();

      subtitle.textContent = orders.length
        ? orders.length + (orders.length === 1 ? ' pedido guardado' : ' pedidos guardados')
        : 'Guardados en este dispositivo';

      if (!orders.length) {
        empty.classList.remove('hidden');
        return;
      }

      list.innerHTML = orders.map(function (order) {
        const count = order.items.reduce(function (sum, item) { return sum + item.qty; }, 0);
        const preview = order.items.slice(0, 2).map(function (item) {
          return item.qty + ' × ' + Shop.escapeHtml(item.name);
        }).join(' · ') + (order.items.length > 2 ? ' · +' + (order.items.length - 2) + ' más' : '');
        return '' +
          '<article class="bg-gray-900 border border-gray-800 rounded-2xl p-4">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div class="min-w-0">' +
                '<p class="font-bold">' + order.id + '</p>' +
                '<p class="text-[11px] text-gray-500">' + Shop.formatDateTime(order.date) + ' · ' + count + (count === 1 ? ' artículo' : ' artículos') + '</p>' +
              '</div>' +
              '<span class="shrink-0 text-[10px] font-bold text-amber-300 bg-amber-400/10 border border-amber-400/30 px-2 py-1 rounded-full">Pendiente</span>' +
            '</div>' +
            '<p class="text-xs text-gray-400 mt-2 truncate">' + preview + '</p>' +
            '<div class="flex items-end justify-between mt-3">' +
              '<p class="text-lg font-extrabold text-cyan-300">' + Shop.formatMoney(order.total) + '</p>' +
              '<div class="flex gap-2">' +
                '<button data-wa="' + order.id + '" class="text-xs font-bold bg-emerald-400/15 border border-emerald-400/30 text-emerald-300 px-3 py-2 rounded-xl">WhatsApp</button>' +
                '<a href="./pedido.html?id=' + encodeURIComponent(order.id) + '" class="text-xs font-bold bg-cyan-400 text-gray-950 px-3 py-2 rounded-xl">Ver detalle</a>' +
              '</div>' +
            '</div>' +
          '</article>';
      }).join('');

      list.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-wa]');
        if (!btn) return;
        const order = Shop.findOrder(btn.getAttribute('data-wa'));
        if (!order) return;
        const link = Shop.whatsappLink(order);
        if (!link) {
          window.miappToast('La tienda todavía no configuró su WhatsApp');
          return;
        }
        window.open(link, '_blank');
      });
    })();
  </script>
</body>
</html>
