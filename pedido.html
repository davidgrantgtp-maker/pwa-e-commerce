<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Pedido generado - MiApp Store" />
  <title>Pedido generado · MiApp Store</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { accent: '#22d3ee' } } } };</script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body data-page="" class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col relative shadow-2xl">
    <header class="sticky top-0 z-20 bg-gray-950/90 backdrop-blur border-b border-gray-800 safe-top">
      <div class="flex items-center gap-3 px-4 pt-3 pb-3">
        <a href="./index.html" class="w-10 h-10 grid place-items-center rounded-xl bg-gray-900 border border-gray-800 shrink-0" aria-label="Ir al inicio">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
        </a>
        <p class="flex-1 font-bold">Pedido generado</p>
      </div>
    </header>

    <main id="order-view" class="flex-1 px-4 pb-10 pt-4 space-y-4"></main>

    <div id="toast" class="fixed bottom-8 left-1/2 z-30 bg-cyan-400 text-gray-950 text-sm font-semibold px-4 py-2.5 rounded-full shadow-xl max-w-[90%] text-center"></div>
  </div>

  <script src="./js/products.js"></script>
  <script src="./js/shop.js"></script>
  <script src="./js/app.js"></script>
  <script>
    (function () {
      const view = document.getElementById('order-view');
      const id = new URLSearchParams(location.search).get('id');
      const order = Shop.findOrder(id);

      if (!order) {
        view.innerHTML = '<div class="text-center py-16">' +
          '<div class="w-16 h-16 mx-auto rounded-full bg-red-500/10 border border-red-500/30 grid place-items-center text-red-300 text-2xl">!</div>' +
          '<p class="text-lg font-bold mt-4">Pedido no encontrado</p>' +
          '<p class="text-sm text-gray-400 mt-1">El pedido no existe en este dispositivo.</p>' +
          '<a href="./index.html" class="inline-block mt-5 bg-cyan-400 text-gray-950 font-bold px-5 py-3 rounded-full">Volver a la tienda</a>' +
          '</div>';
        return;
      }

      const settings = Shop.getSettings();
      const waLink = Shop.whatsappLink(order);
      const message = Shop.orderMessage(order);
      const rows = order.items.map(function (item) {
        return '<div class="flex justify-between gap-2"><span class="text-gray-300 truncate">' + item.qty + ' × ' + Shop.escapeHtml(item.name) + '</span><span class="font-semibold shrink-0">' + Shop.formatMoney(item.subtotal) + '</span></div>';
      }).join('');

      const warning = !Shop.normalizePhone(settings.sellerPhone)
        ? '<div class="bg-amber-400/10 border border-amber-400/30 rounded-2xl p-4 text-sm text-amber-200">' +
            '<p class="font-bold">Falta configurar el WhatsApp del vendedor</p>' +
            '<p class="text-[12px] mt-1">Para enviar el pedido, cargá el número en Perfil. El pedido ya quedó guardado en este dispositivo.</p>' +
            '<a href="./perfil.html" class="inline-block mt-3 text-xs font-bold bg-amber-400 text-gray-950 px-3 py-2 rounded-full">Configurar ahora</a>' +
          '</div>'
        : '';

      view.innerHTML = '' +
        '<section class="text-center pt-4 pb-2">' +
          '<div class="w-20 h-20 mx-auto rounded-full bg-emerald-400/15 border border-emerald-400/30 grid place-items-center">' +
            '<svg class="w-10 h-10 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</div>' +
          '<h1 class="text-2xl font-extrabold mt-4">¡Pedido generado!</h1>' +
          '<p class="text-sm text-gray-400 mt-1">Guardado en tu dispositivo como <span class="text-cyan-300 font-bold">' + order.id + '</span></p>' +
          '<span class="inline-block mt-2 text-[11px] font-bold text-amber-300 bg-amber-400/10 border border-amber-400/30 px-2.5 py-1 rounded-full">Pendiente de confirmar</span>' +
        '</section>' +
        warning +
        '<section class="bg-gray-900 border border-gray-800 rounded-2xl p-4">' +
          '<h2 class="font-bold">Enviar el pedido al vendedor</h2>' +
          '<p class="text-xs text-gray-400 mt-1">Se abre WhatsApp con el mensaje ya escrito. Vos lo enviás manualmente.</p>' +
          '<button id="send-wa" class="w-full mt-3 bg-emerald-400 text-gray-950 font-extrabold py-3.5 rounded-2xl active:scale-[0.98] transition flex items-center justify-center gap-2">' +
            '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.7-.8c.1-.2.1-.3 0-.5l-.8-1.6c-.1-.2-.2-.2-.4-.2h-.5c-.2 0-.5.1-.7.4-.2.3-.9.9-.9 2.2 0 1.3.9 2.5 1 2.7.1.2 1.7 2.7 4.2 3.7 2.5 1 2.5.7 3 .7.5 0 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3Z"/></svg>' +
            'Enviar por WhatsApp' +
          '</button>' +
          '<button id="copy-msg" class="w-full mt-2 bg-gray-950 border border-gray-700 text-gray-200 font-semibold py-3 rounded-2xl active:scale-[0.98] transition">Copiar mensaje</button>' +
        '</section>' +
        '<section class="bg-gray-900 border border-gray-800 rounded-2xl p-4">' +
          '<div class="flex justify-between items-start">' +
            '<div><h2 class="font-bold">Detalle del pedido</h2><p class="text-[11px] text-gray-500">' + Shop.formatDateTime(order.date) + '</p></div>' +
            '<span class="text-xs font-bold text-cyan-300">' + order.id + '</span>' +
          '</div>' +
          '<div class="mt-3 space-y-2 text-sm">' + rows + '</div>' +
          '<div class="border-t border-gray-800 mt-3 pt-3 space-y-1.5 text-sm">' +
            '<div class="flex justify-between"><span class="text-gray-400">Subtotal</span><span class="font-semibold">' + Shop.formatMoney(order.subtotal) + '</span></div>' +
            (order.discount ? '<div class="flex justify-between text-emerald-300"><span>Descuento</span><span>-' + Shop.formatMoney(order.discount) + '</span></div>' : '') +
            '<div class="flex justify-between"><span class="text-gray-400">Envío</span><span class="font-semibold">' + (order.shipping === 0 ? 'Gratis' : Shop.formatMoney(order.shipping)) + '</span></div>' +
            '<div class="flex justify-between items-end pt-1"><span class="font-bold">Total</span><span class="text-xl font-extrabold text-cyan-300">' + Shop.formatMoney(order.total) + '</span></div>' +
          '</div>' +
        '</section>' +
        '<section class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-sm">' +
          '<h2 class="font-bold mb-2">Tus datos</h2>' +
          '<div class="space-y-1.5 text-gray-300">' +
            '<p><span class="text-gray-500">Nombre:</span> ' + Shop.escapeHtml(order.customer.name) + '</p>' +
            '<p><span class="text-gray-500">Teléfono:</span> ' + Shop.escapeHtml(order.customer.phone) + '</p>' +
            '<p><span class="text-gray-500">Entrega:</span> ' + (order.customer.delivery === 'retiro' ? 'Retiro en local' : 'Envío a domicilio') + '</p>' +
            (order.customer.address ? '<p><span class="text-gray-500">Dirección:</span> ' + Shop.escapeHtml(order.customer.address) + '</p>' : '') +
            '<p><span class="text-gray-500">Pago:</span> ' + (order.customer.payment === 'transferencia' ? 'Transferencia' : 'Efectivo') + '</p>' +
            (order.customer.notes ? '<p><span class="text-gray-500">Notas:</span> ' + Shop.escapeHtml(order.customer.notes) + '</p>' : '') +
          '</div>' +
        '</section>' +
        '<details class="bg-gray-900 border border-gray-800 rounded-2xl p-4">' +
          '<summary class="font-bold text-sm cursor-pointer">Ver mensaje que se enviará</summary>' +
          '<pre id="wa-preview" class="mt-3 text-[11px] leading-relaxed text-gray-400 whitespace-pre-wrap break-words"></pre>' +
        '</details>' +
        '<div class="grid grid-cols-2 gap-2">' +
          '<a href="./pedidos.html" class="bg-gray-900 border border-gray-800 text-center text-sm font-bold py-3 rounded-2xl">Mis pedidos</a>' +
          '<a href="./index.html" class="bg-cyan-400 text-gray-950 text-center text-sm font-bold py-3 rounded-2xl">Seguir comprando</a>' +
        '</div>';

      document.getElementById('wa-preview').textContent = message;

      document.getElementById('send-wa').addEventListener('click', function () {
        if (!waLink) {
          window.miappToast('Configurá el WhatsApp del vendedor en Perfil');
          return;
        }
        window.open(waLink, '_blank');
      });

      document.getElementById('copy-msg').addEventListener('click', function () {
        function done() { window.miappToast('Mensaje copiado'); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(message).then(done).catch(function () { fallbackCopy(message, done); });
        } else {
          fallbackCopy(message, done);
        }
      });

      function fallbackCopy(text, done) {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); done(); } catch (e) { window.miappToast('No se pudo copiar'); }
        document.body.removeChild(area);
      }
    })();
  </script>
</body>
</html>
