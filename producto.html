<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Detalle de producto - MiApp Store" />
  <title>App Store</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { accent: '#22d3ee' } } } };</script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body data-page="" class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col relative shadow-2xl">
    <header class="sticky top-0 z-20 bg-gray-950/90 backdrop-blur border-b border-gray-800 safe-top">
      <div class="flex items-center gap-3 px-4 pt-3 pb-3">
        <a href="./index.html" class="w-10 h-10 grid place-items-center rounded-xl bg-gray-900 border border-gray-800 shrink-0" aria-label="Volver">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <p class="flex-1 font-bold truncate">Detalle del producto</p>
        <a href="./carrito.html" class="relative w-10 h-10 grid place-items-center rounded-xl bg-gray-900 border border-gray-800 shrink-0" aria-label="Carrito">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          <span data-cart-count class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-cyan-400 text-gray-950 text-[10px] font-bold grid place-items-center">0</span>
        </a>
      </div>
    </header>

    <main class="flex-1 pb-28">
      <div id="product-view"></div>
      <section id="related-wrap" class="px-4 pt-6">
        <h2 class="font-bold mb-3">También te puede gustar</h2>
        <div id="related" class="grid grid-cols-2 gap-3"></div>
      </section>
    </main>

    <nav class="tabbar fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-gray-950/95 backdrop-blur border-t border-gray-800 z-20">
      <div class="grid grid-cols-4 px-4 pt-2">
        <a href="./index.html" data-tab="home" class="tab-link flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
          Inicio<span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
        <a href="./carrito.html" data-tab="carrito" class="tab-link relative flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          Carrito<span data-cart-count class="hidden absolute top-0 right-1/2 translate-x-5 min-w-[16px] h-4 px-1 rounded-full bg-cyan-400 text-gray-950 text-[9px] font-bold grid place-items-center">0</span><span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
        <a href="./pedidos.html" data-tab="pedidos" class="tab-link relative flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          Pedidos<span data-orders-count class="hidden absolute top-0 right-1/2 translate-x-5 min-w-[16px] h-4 px-1 rounded-full bg-amber-400 text-gray-950 text-[9px] font-bold grid place-items-center">0</span><span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
        <a href="./perfil.html" data-tab="perfil" class="tab-link flex flex-col items-center gap-1 py-1 text-[11px] font-semibold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>
          Perfil<span class="tab-dot w-1 h-1 rounded-full bg-cyan-400"></span>
        </a>
      </div>
    </nav>

    <div id="toast" class="fixed bottom-24 left-1/2 z-30 bg-cyan-400 text-gray-950 text-sm font-semibold px-4 py-2.5 rounded-full shadow-xl max-w-[90%] text-center"></div>
  </div>

  <script src="./js/supabase-config.js"></script>
  <script src="./js/storefront.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/shop.js"></script>
  <script src="./js/app.js"></script>
  <script>
    (function () {
      const view = document.getElementById('product-view');
      const relatedWrap = document.getElementById('related-wrap');
      const related = document.getElementById('related');
      const id = new URLSearchParams(location.search).get('id');
      let qty = 1;

      function relatedCard(p) {
        return '' +
          '<a href="./producto.html?id=' + encodeURIComponent(p.id) + '" class="card-press bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden block">' +
            '<div class="aspect-square bg-gray-800">' +
              '<img src="' + p.image + '" alt="' + Shop.escapeHtml(p.name) + '" loading="lazy" class="w-full h-full object-cover" onerror="this.onerror=null;this.src=\'' + p.fallback + '\'">' +
            '</div>' +
            '<div class="p-3">' +
              '<p class="text-xs font-semibold leading-snug line-clamp-2">' + Shop.escapeHtml(p.name) + '</p>' +
              '<p class="text-sm font-bold text-cyan-300 mt-1">' + Shop.formatMoney(p.price) + '</p>' +
            '</div>' +
          '</a>';
      }

      function init() {
      const product = Shop.getProduct(id);
      relatedWrap.classList.remove('hidden');

      if (!product) {
        view.innerHTML = '<div class="p-8 text-center"><p class="text-lg font-bold">Producto no encontrado</p>' +
          '<p class="text-sm text-gray-400 mt-1">Puede que ya no esté disponible.</p>' +
          '<a href="./index.html" class="inline-block mt-4 bg-cyan-400 text-gray-950 font-bold px-5 py-2.5 rounded-full">Volver a la tienda</a></div>';
        relatedWrap.classList.add('hidden');
        return;
      }

      document.title = product.name + ' · MiApp Store';
      const oldPrice = product.oldPrice
        ? '<span class="text-sm text-gray-500 line-through">' + Shop.formatMoney(product.oldPrice) + '</span>'
        : '';
      const tag = product.tag
        ? '<span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-cyan-400/10 border border-cyan-400/30 text-cyan-300">' + Shop.escapeHtml(product.tag) + '</span>'
        : '';

      view.innerHTML = '' +
        '<div class="relative aspect-square bg-gray-900">' +
          '<img src="' + product.image + '" alt="' + Shop.escapeHtml(product.name) + '" class="w-full h-full object-cover" onerror="this.onerror=null;this.src=\'' + product.fallback + '\'">' +
          '<div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-gray-950 to-transparent"></div>' +
          '<span class="absolute top-4 left-4 text-[11px] font-bold px-2.5 py-1 rounded-full bg-gray-950/70 backdrop-blur border border-gray-700">' + Shop.escapeHtml(product.category) + '</span>' +
        '</div>' +
        '<div class="px-4 -mt-6 relative">' +
          '<div class="flex flex-wrap items-center gap-2">' + tag + '</div>' +
          '<h1 class="text-2xl font-extrabold leading-tight mt-2">' + Shop.escapeHtml(product.name) + '</h1>' +
          '<div class="flex items-end gap-2 mt-2">' +
            '<p class="text-2xl font-extrabold text-cyan-300">' + Shop.formatMoney(product.price) + '</p>' +
            oldPrice +
          '</div>' +
          '<p class="text-xs text-emerald-300 mt-2 flex items-center gap-1.5">' +
            '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Disponible · listo para pedir' +
          '</p>' +
          '<p class="text-sm text-gray-400 mt-4 leading-relaxed">' + Shop.escapeHtml(product.description) + '</p>' +
          '<div class="mt-5 flex items-center justify-between bg-gray-900 border border-gray-800 rounded-2xl p-2 pl-4">' +
            '<span class="text-sm font-semibold">Cantidad</span>' +
            '<div class="flex items-center gap-1">' +
              '<button id="qty-minus" class="w-9 h-9 rounded-xl bg-gray-950 border border-gray-700 grid place-items-center active:scale-90 transition" aria-label="Quitar uno">' +
                '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14" stroke-linecap="round"/></svg>' +
              '</button>' +
              '<span id="qty-value" class="w-8 text-center font-bold">1</span>' +
              '<button id="qty-plus" class="w-9 h-9 rounded-xl bg-gray-950 border border-gray-700 grid place-items-center active:scale-90 transition" aria-label="Agregar uno">' +
                '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3 grid grid-cols-2 gap-2">' +
            '<button id="add-cart" class="border border-cyan-400/50 text-cyan-300 font-bold py-3.5 rounded-2xl active:scale-[0.98] transition">Agregar</button>' +
            '<button id="buy-now" class="bg-cyan-400 text-gray-950 font-bold py-3.5 rounded-2xl active:scale-[0.98] transition">Comprar ahora</button>' +
          '</div>' +
          '<p class="text-[11px] text-gray-500 mt-3 text-center">Sin pago online: coordinás el pago por WhatsApp con el vendedor.</p>' +
        '</div>';

      const qtyValue = document.getElementById('qty-value');
      function paintQty() { qtyValue.textContent = qty; }
      document.getElementById('qty-minus').addEventListener('click', function () {
        qty = Math.max(1, qty - 1);
        paintQty();
      });
      document.getElementById('qty-plus').addEventListener('click', function () {
        qty = Math.min(99, qty + 1);
        paintQty();
      });
      document.getElementById('add-cart').addEventListener('click', function () {
        Shop.addToCart(product.id, qty);
        window.miappToast(qty + ' x ' + product.name + ' agregado');
      });
      document.getElementById('buy-now').addEventListener('click', function () {
        Shop.addToCart(product.id, qty);
        location.href = './carrito.html';
      });

      const others = (window.PRODUCTS || []).filter(function (p) {
        return p.id !== product.id && p.category === product.category;
      }).concat((window.PRODUCTS || []).filter(function (p) {
        return p.id !== product.id && p.category !== product.category;
      })).slice(0, 4);
      related.innerHTML = others.map(relatedCard).join('');
      }

      document.addEventListener('products:updated', init);
      init();
    })();
  </script>
</body>
</html>
