<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · MiApp Store</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/admin.css" rel="stylesheet">
</head>
<body>
  <div id="boot" class="p-5 text-center text-secondary">Cargando panel…</div>

  <div id="login-screen" class="login-wrap d-none">
    <div class="card login-card shadow">
      <div class="login-logo">M</div>
      <h1 class="h4 text-center mb-1">MiApp Store</h1>
      <p class="text-center text-secondary small mb-4">Panel de administración</p>
      <div id="login-error" class="alert alert-danger py-2 small d-none"></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="login-email">Email</label>
          <input class="form-control" id="login-email" name="email" type="email" value="admin@miapp.local" required autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label" for="login-password">Contraseña</label>
          <input class="form-control" id="login-password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-accent w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      </form>
    </div>
  </div>

  <div id="app" class="admin-shell d-none">
    <aside class="admin-sidebar">
      <div class="brand">
        <div class="brand-logo">M</div>
        <div>
          <div class="brand-name">MiApp Store</div>
          <div class="brand-sub">Administración</div>
        </div>
      </div>
      <nav class="nav flex-column admin-nav">
        <a class="nav-link" href="#/" data-nav="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link" href="#/productos" data-nav="productos"><i class="bi bi-box-seam"></i> Productos</a>
        <a class="nav-link" href="#/categorias" data-nav="categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a class="nav-link" href="#/importar" data-nav="importar"><i class="bi bi-file-earmark-arrow-up"></i> Importar</a>
        <a class="nav-link" href="#/masivo" data-nav="masivo"><i class="bi bi-lightning-charge"></i> Actualización masiva</a>
      </nav>
      <div class="sidebar-foot">
        <a class="nav-link" href="../index.html" target="_blank" rel="noopener"><i class="bi bi-phone"></i> Ver tienda</a>
        <a class="nav-link" href="#/cuenta"><i class="bi bi-shield-lock"></i> Mi cuenta</a>
        <button class="nav-link btn btn-link text-start" id="logout" type="button"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </div>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="menu-toggle" type="button" aria-label="Menú"><i class="bi bi-list"></i></button>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <div class="ms-auto d-flex align-items-center gap-2">
          <div class="text-end d-none d-sm-block">
            <div class="small" id="user-name"></div>
            <div class="text-secondary" style="font-size:12px" id="user-email"></div>
          </div>
          <div class="avatar" id="user-avatar">?</div>
        </div>
      </header>
      <main class="admin-content" id="view"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
